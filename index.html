<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VinylStore</title>
    <link rel="icon" type="image/x-icon" href="./assets/icons/favIcon.svg" />
    <link rel="stylesheet" href="./styles/standard.css" />
    <link rel="stylesheet" href="./styles/font-face.css" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./scripts/collection.js"></script>
    <script src="./scripts/template.js"></script>
  </head>
  <body onload="init()">
    <header>
      <div class="wrapper"></div>
    </header>
    <main>
      <h1>VinylStore</h1>
      <div class="wrapper">
        <div id="collection-status" class="collectionStatus" hidden></div>
        <div class="controls">
          <input
            type="text"
            id="search"
            placeholder="Search by title or artist…"
            oninput="applyFiltersAndRender()"
          />
          <select id="sort" onchange="applyFiltersAndRender()">
            <option value="default">Sort: Default</option>
            <option value="year-asc">Year ↑</option>
            <option value="year-desc">Year ↓</option>
            <option value="price-asc">Price ↑</option>
            <option value="price-desc">Price ↓</option>
          </select>
          <button
            id="favFilter"
            class="favFilterBtn"
            onclick="toggleFavFilter()"
          >
            <img
              src="./assets/icons/star_inactive.svg"
              class="inactive"
              alt="All records"
            />
            <img
              src="./assets/icons/star_active.svg"
              class="active"
              alt="Favourites only"
            />
            Favourites
          </button>
          <span id="result-count" class="resultCount"></span>
          <button
            id="loadPricesBtn"
            class="loadPricesBtn"
            onclick="loadMarketplacePrices()"
          >Load Prices</button>
        </div>
        <div id="collection"></div>
      </div>
    </main>
    <footer>
      <div class="wrapper"></div>
    </footer>
  </body>
  <script src="./scripts/discogs-config.js"></script>
  <script src="./scripts/storage.js"></script>
  <script src="./scripts/discogs.js"></script>
  <script src="./scripts/prices.js"></script>
  <script src="./scripts/collection-ui.js"></script>
  <script src="./script.js"></script>
</html>
